# ruff.toml — the machine-checkable style contract for this repo.
#
# Why a config at all: no human reads this code, so the standard has to be executable. Run
# `python3 -m ruff check .` (or let bench/smoke.py run it) instead of arguing about style.
# A violation is a defect, not a preference.
#
# What is enforced: E (pycodestyle: blank-line convention included), F (pyflakes: undefined
# names, unused imports), W (whitespace), B (bugbear: mutable defaults, loop-closure capture,
# silent zip truncation).
#
# What is deliberately not enforced:
#   E501 line length — the module headers and the model-facing rule strings are prose; wrapping
#   them at 88/100 columns makes them harder to read, which is the opposite of the goal.
#
# What is excluded and why: every *_fixtures/, hard_hidden/ and sandbox_hidden/ tree is graded
# INPUT for the benchmark, not repo source. They contain deliberate unused imports and broken
# code on purpose; linting them would be linting the exam. bench/traces/, bench/ws/, bench/.tmp/
# and bench/.cache/ are generated evidence (AGENTS.md §4.9-4.10).

target-version = "py310"
line-length = 100

exclude = [
    "bench/archive",
    "bench/.tmp",
    "bench/.cache",
    "bench/ws",
    "bench/traces",
    "bench/fixtures",
    "bench/edge_fixtures",
    "bench/harness_fixtures",
    "bench/sandbox_fixtures",
    "bench/sandbox_hidden",
    "bench/hard_fixtures",
    "bench/hard_hidden",
    "tui/node_modules",
]

[lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]
# preview enables the blank-line rules (E302/E305/E306): one blank-line convention across the
# tree is the difference between a search hit you can trust and a hit you have to re-read.
preview = true
